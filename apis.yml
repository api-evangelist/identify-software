description: 'Identify Software Ltd. was an Israeli enterprise-software company founded in 1996 in
  Petah Tikva by Yochi Slonim, backed by earlybird (invested 2001). It built application performance
  management, software-testing, and business-process-automation tooling that helped IT teams reproduce,
  diagnose, and resolve production application problems, best known for its AppSight problem-resolution
  suite. It is a legacy portfolio entry rather than an active API provider: the identify.software domain
  is parked/for-sale, there is no live developer portal, documentation, or public API surface to enrich,
  so this profile is retained as a historical VC-portfolio lead only.'
